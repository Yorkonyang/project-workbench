version: '3.8'
services:
  workbench:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: project-workbench
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
