# ============================================================
# 项目工作台 Nginx 配置
# 适用环境: CentOS 7/8 + Nginx
# 部署路径: /opt/project-workbench
# ============================================================

server {
    listen       80;
    server_name  workbench.grinm.com;  # 替换为实际域名或 IP

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 根目录指向构建产物
    root /opt/project-workbench/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 静态资源缓存（带 hash 的文件名长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon
    location = /favicon.svg {
        expires 7d;
    }

    # 后端 API 反向代理（Node 服务，默认 3000 端口）
    # 注意：项目群聊的实时推送走 SSE（/api/chat/stream），必须关闭代理缓冲，
    # 否则 Nginx 会把事件攒在缓冲区里不发，前端表现为"消息要等很久才出现"。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # SSE 关键配置：禁用缓冲 + 拉长读超时（否则 60s 空闲会被断开）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA 路由 fallback：所有未匹配的路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
